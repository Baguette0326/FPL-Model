[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fpl-draft-model"
version = "0.1.0"
description = "ML projections and live draft recommendations for a four-manager FPL Draft league"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Baguette0326" }]

[project.optional-dependencies]
model = [
  "joblib>=1.4",
  "numpy>=2.0",
  "pandas>=2.2",
  "scikit-learn>=1.5",
]
dev = [
  "pytest>=8.3",
  "ruff>=0.8",
]

[project.scripts]
fpl-draft = "fpl_model.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
